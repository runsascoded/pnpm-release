name: Release
on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use'
        type: string
        default: '20'
      pnpm_version:
        description: 'pnpm version to use'
        type: string
        default: '10'
      build_command:
        description: 'Build command to run'
        type: string
        default: 'pnpm run build'
      publish_args:
        description: 'Additional args for pnpm publish'
        type: string
        default: '--access public --no-git-checks'
      pkg:
        description: 'Package subdirectory to publish (monorepo mode)'
        type: string
        default: ''
    secrets:
      npm_token:
        description: 'NPM authentication token. Omit to publish via OIDC trusted publishing (the job already grants `id-token: write`; configure a Trusted Publisher for the package on npm).'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: runsascoded/pnpm-release@v1
        with:
          npm_token: ${{ secrets.npm_token }}
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
          build_command: ${{ inputs.build_command }}
          publish_args: ${{ inputs.publish_args }}
          pkg: ${{ inputs.pkg }}
